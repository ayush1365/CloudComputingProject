apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  labels: {app: web}
spec:
  replicas: 2
  selector:
    matchLabels: {app: web}
  template:
    metadata:
      labels: {app: web}
    spec:
      containers:
        - name: web
          image: visitor-counter:v1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
          env:
            - {name: REDIS_HOST, value: redis}
            - {name: CLUSTER_NAME, value: local}
          resources:
            requests: {cpu: 100m, memory: 64Mi}
            limits: {cpu: 250m, memory: 128Mi}
          readinessProbe:
            httpGet: {path: /ready, port: 5000}
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /health, port: 5000}
            initialDelaySeconds: 10
            periodSeconds: 10
