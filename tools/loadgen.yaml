# Load generator: 3 busybox pods hammering the CPU-heavy /work endpoint
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loadgen
spec:
  replicas: 3
  selector:
    matchLabels: {app: loadgen}
  template:
    metadata:
      labels: {app: loadgen}
    spec:
      containers:
        - name: loadgen
          image: busybox:1.36
          command: ["/bin/sh", "-c", "while true; do wget -q -O- http://web/work >/dev/null; done"]
