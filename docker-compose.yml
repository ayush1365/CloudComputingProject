services:
  web:
    build: .
    image: visitor-counter:v1
    ports:
      - "5000:5000"
    environment:
      REDIS_HOST: redis
      CLUSTER_NAME: compose
    depends_on:
      redis:
        condition: service_healthy
  redis:
    image: redis:7-alpine
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
volumes:
  redis-data:
