events {}
http {
  upstream app {
    server host.docker.internal:8081 max_fails=1 fail_timeout=5s;   # private cluster (primary)
    server host.docker.internal:8082 backup;                         # public cluster (failover)
  }
  server {
    listen 80;
    location / {
      proxy_pass http://app;
      proxy_connect_timeout 2s;
      proxy_next_upstream error timeout http_502 http_503;
      add_header X-Served-By $upstream_addr always;
    }
  }
}
